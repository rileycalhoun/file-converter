services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BIND_ADDRESS: 0.0.0.0:8080
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?Set GATEWAY_TOKEN in .env}
      GOTENBERG_URL: http://gotenberg:3000
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      gotenberg:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.34.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
